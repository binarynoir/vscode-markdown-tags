version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint peers on typescript <6.1.0; lift when it supports newer
      - dependency-name: typescript
        versions: ['>=6.1.0']
      # must not exceed engines.vscode, or vsce refuses to package
      - dependency-name: '@types/vscode'
      # v15's CJS typings import ESM types without resolution-mode, breaking module Node16
      - dependency-name: markdown-it
        versions: ['>=15.0.0']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
